name: campus_time
description: "课间：大学课程与个人时间管理。"
publish_to: 'none'
version: 0.2.1+17

environment:
  sdk: ^3.13.5

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdfrx: ^2.6.5
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  flutter_localizations:
    sdk: flutter
  sqlite3: ^3.5.2
  schedule_core:
    path: ../../packages/schedule_core
  schedule_storage:
    path: ../../packages/schedule_storage
  schedule_pdf:
    path: ../../packages/schedule_pdf
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/pomodoro_cat.txt
    - assets/default_timetable.json
